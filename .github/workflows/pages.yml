name: Publiceer GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
      - '.openai/hosting.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Haal broncode op
        uses: actions/checkout@v6
      - name: Gebruik Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Controleer bronbestanden
        run: npm run check
      - name: Test de kern
        run: npm test
      - name: Configureer Pages
        uses: actions/configure-pages@v5
      - name: Upload alleen de webapp
        uses: actions/upload-pages-artifact@v4
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceer de webapp
        id: deployment
        uses: actions/deploy-pages@v4
